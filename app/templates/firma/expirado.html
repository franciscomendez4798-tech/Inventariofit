<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Enlace no válido</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f8f9fa; }
    .icon-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #f8d7da;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
    }
  </style>
</head>
<body>
<div class="container-fluid px-3 py-5 text-center" style="max-width:480px; margin:0 auto;">
  <div class="icon-circle">
    <i class="bi bi-clock-history text-danger" style="font-size:2.2rem;"></i>
  </div>
  <h4 class="fw-bold mb-2">Enlace no válido</h4>
  <p class="text-muted mb-4">
    Este enlace de firma expiró, ya fue usado, o la orden ya fue procesada.
  </p>
  <div class="alert alert-warning text-start">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    Solicita al encargado de mantenimiento que genere un nuevo enlace.
  </div>
  <p class="text-muted small mt-4">Puedes cerrar esta ventana.</p>
</div>
</body>
</html>
