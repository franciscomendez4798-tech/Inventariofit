<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Firma completada</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f8f9fa; }
    .check-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #d1e7dd;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
    }
  </style>
</head>
<body>
<div class="container-fluid px-3 py-5 text-center" style="max-width:480px; margin:0 auto;">
  <div class="check-circle">
    <i class="bi bi-check-lg text-success" style="font-size:2.5rem;"></i>
  </div>
  <h4 class="fw-bold mb-2">Todo correcto</h4>
  <p class="text-muted mb-4">
    La orden de servicio fue firmada y cerrada exitosamente.
  </p>
  <div class="alert alert-info text-start">
    <i class="bi bi-info-circle-fill me-2"></i>
    <strong>Regresa a Almacén</strong> para recibir más instrucciones.
  </div>
  <p class="text-muted small mt-4">
    Puedes cerrar esta ventana.
  </p>
</div>
</body>
</html>
