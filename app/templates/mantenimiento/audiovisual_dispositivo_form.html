{% extends 'base.html' %}
{% block title %}Nuevo Dispositivo AV{% endblock %}
{% block breadcrumb %}
  <a href="{{ url_for('mantenimiento.audiovisual') }}" class="text-muted text-decoration-none">Audiovisual</a>
  <span class="mx-1 text-muted">/</span><strong>Nuevo Dispositivo</strong>
{% endblock %}

{% block content %}
<div class="animate-fade-in" style="max-width:500px; margin:0 auto;">
  <h1 class="page-title-gradient">Nuevo Dispositivo</h1>
  <p class="page-subtitle mb-4">Registra un control, cable HDMI, extensión u otro equipo audiovisual.</p>

  <form method="POST">
    <div class="premium-card mb-4">
      <div class="card-body p-4">
        <div class="mb-3">
          <label class="form-label fw-semibold">Nombre del dispositivo <span class="text-danger">*</span></label>
          <select name="nombre" class="form-select" required>
            <option value="">— Selecciona tipo —</option>
            <option value="Control TV">Control TV</option>
            <option value="Cable HDMI">Cable HDMI</option>
            <option value="Extensión eléctrica">Extensión eléctrica</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Aula / Salón asignado <span class="text-danger">*</span></label>
          <input type="text" name="aula" class="form-control" required
                 placeholder="Ej. Salón 101, Lab. Electrónica…">
        </div>
      </div>
    </div>
    <div class="d-flex gap-3">
      <button type="submit" class="btn btn-primary px-5">
        <i class="bi bi-check2 me-2"></i>Registrar
      </button>
      <a href="{{ url_for('mantenimiento.audiovisual') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
