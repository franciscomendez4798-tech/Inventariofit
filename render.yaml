# ══════════════════════════════════════════════════════════════════════════════
# render.yaml — Configuración de despliegue para Render.com
# ══════════════════════════════════════════════════════════════════════════════
# Uso: conecta tu repo de GitHub en Render y este archivo se detecta
# automáticamente (Infrastructure as Code).
# ══════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: inventario-fing
    runtime: python
    region: oregon           # Cambiar a 'frankfurt' si necesitas baja latencia en Europa/LATAM
    plan: free               # Cambiar a 'starter' ($7/mes) para sin hibernación

    # ── Build ──────────────────────────────────────────────────────────────
    buildCommand: pip install -r requirements.txt
    startCommand: ./entrypoint.sh

    # ── Variables de entorno ───────────────────────────────────────────────
    # IMPORTANTE: Las marcadas con 'sync: false' debes configurarlas
    # manualmente en el panel de Render (Environment → Add Environment Variable)
    # para no exponer credenciales en el repositorio.
    envVars:
      - key: FLASK_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true         # Render genera un valor aleatorio seguro automáticamente

      - key: FIRMA_SECRET_KEY
        generateValue: true

      # DATABASE_URL: Si no la defines, el sistema usa SQLite en instance/.
      # ⚠️  Los datos SQLite se pierden en cada redeploy en el plan Free.
      # Para persistencia, añade el servicio de base de datos de abajo (PostgreSQL)
      # o monta un Disk en /data.
      - key: DATABASE_URL
        fromDatabase:
          name: inventario-db
          property: connectionString

      - key: SESSION_INACTIVITY_TIMEOUT
        value: "10800"

      - key: LOG_LEVEL
        value: info

      - key: WEB_CONCURRENCY
        value: "2"

    # ── Health check ────────────────────────────────────────────────────────
    healthCheckPath: /login

# ── Base de Datos PostgreSQL (Plan Free: 1 GB, expira a 90 días) ──────────────
databases:
  - name: inventario-db
    databaseName: inventario
    plan: free
    region: oregon
